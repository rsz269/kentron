name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust tests (with OCCT's dataset)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # CI machines are slower than the ones the per-case limit (40 s of CPU) was set on.
      KENTRON_CASE_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache OCCT's test dataset
        id: dataset
        uses: actions/cache@v4
        with:
          path: ~/occt-data
          key: occt-dataset-7.9.0-source-data-3d097a03
      - name: Download OCCT's test dataset
        if: steps.dataset.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/occt-data
          curl -fsSL https://github.com/Open-Cascade-SAS/OCCT/releases/download/V7_9_0_beta1/opencascade-dataset-7.9.0.tar.xz | tar -xJ -C ~/occt-data
          # Shapes the tests read from OCCT's source tree (its data directory), not the dataset.
          git init -q /tmp/occt && cd /tmp/occt
          git remote add origin https://github.com/Open-Cascade-SAS/OCCT.git
          git sparse-checkout set data
          git fetch -q --depth 1 --filter=blob:none origin 3d097a0328e71b826377d4814ab05ec3c3d23871
          git checkout -q FETCH_HEAD
          mv data ~/occt-data/occt-source-data
      - name: Test
        run: |
          set -o pipefail
          cargo test --release --workspace --no-fail-fast 2>&1 | tee test.log
      # The failing tests and how each failed, as annotations and in the run's summary
      # (readable without the log), and the whole log kept.
      - name: Report failing tests
        if: failure()
        run: |
          awk '/^---- .* ----$/ { name = $2; n = 0; next }
               name != "" && n < 3 && NF { msg[name] = msg[name] " " $0; n++ }
               /^test .* FAILED$/ { failed[$2] = 1 }
               END { for (t in failed) print t "\t" msg[t] }' test.log | sort > failures.txt
          { echo "## Failing tests"; echo '```'; cut -c1-400 failures.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # (In a workflow command a title escapes ':' and ',', a message '%'.)
          head -40 failures.txt | while IFS=$'\t' read -r name message; do
            title=$(printf '%s' "$name" | sed 's/%/%25/g; s/:/%3A/g; s/,/%2C/g')
            echo "::error title=$title::$(printf '%s' "$message" | cut -c1-300 | sed 's/%/%25/g')"
          done
      - name: Keep the test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

  msrv:
    name: Minimum Rust version (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo +1.88.0 check --workspace --all-targets

  python:
    name: pykentron against CadQuery
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build pykentron
        run: python crates/pykentron/build.py --quick
      - name: Import it
        run: python -c "import sys; sys.path.insert(0, 'crates/pykentron/python'); import pykentron as cq; assert abs(cq.Workplane().box(1, 2, 3).val().Volume() - 6) < 1e-9"
      - name: Compare with CadQuery
        run: |
          python -m pip install --quiet cadquery==2.8.0
          python crates/pykentron/tests/test_against_cadquery.py
      - name: Install it as a package, and run a CadQuery script on it
        run: |
          python -m pip install --quiet "./crates/pykentron[cadquery]"
          cd /tmp
          printf 'import cadquery as cq\nr = cq.Workplane("XY").box(2, 3, 4).faces(">Z").workplane().hole(1)\nprint(round(r.val().Volume(), 4))\n' > script.py
          test "$(pykentron-run script.py)" = "20.8584"
      - uses: astral-sh/setup-uv@v5
      - name: CadQuery's own test suite (against tests/cadquery_baseline.txt)
        run: python crates/pykentron/scripts/cadquery_tests.py

[package]
name = "kentron"
version = "0.16.0"
edition.workspace = true
# (Its SLSQP optimizer is translated from NLopt's: BSD-3-Clause and MIT, LICENSE-SLSQP.)
license = "(MIT OR Apache-2.0) AND BSD-3-Clause AND MIT"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "A boundary-representation CAD kernel: solids over exact curves and surfaces, with booleans, fillets, offsets, sweeps and lofts, modelled on Open CASCADE (OCCT)."
readme = "../../README.md"
keywords = ["cad", "brep", "geometry", "solid-modeling", "nurbs"]
categories = ["mathematics", "graphics", "science"]

[dependencies]
rayon = { version = "1.11", optional = true }
ttf-parser = { version = "0.25.1", optional = true }

[features]
default = ["parallel"]
# Independent steps of operations (pairs of faces to intersect, ...) run on a thread pool.
parallel = ["dep:rayon"]
# Text as faces, from the glyph outlines of TrueType and OpenType fonts.
text = ["dep:ttf-parser"]

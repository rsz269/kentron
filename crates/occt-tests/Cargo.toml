[package]
name = "occt-tests"
version = "0.14.0"
edition.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
# Translations of OCCT's tests (LGPL-2.1 with the Open CASCADE exception) and of BRL-CAD's
# libbg tests (LGPL-2.1): see README.md.
license = "LGPL-2.1-only WITH OCCT-exception-1.0 AND LGPL-2.1-only"
description = "Tests converted from OCCT (GTests and DRAW scripts) by tools/draw2rs.py and by hand, plus the support code they use."

[dependencies]
kentron = { path = "../kentron" }
yaml-rust2 = "0.13.0"
# Running DRAW scripts that use Tcl: an interpreter (src/draw/tcl.rs), with regular expressions.
molt-forked = { version = "0.6.0", features = ["full"] }
regex = "1.11"
# Tests' time limits (src/limit.rs): their threads' processor time, and a pool of their own.
rayon = "1.11"
# The test binaries' allocator (src/lib.rs).
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
libtest-mimic = "0.8.2"

# Test cases in YAML (cases/**/*.yaml), one libtest trial per case.
[[test]]
name = "cases"
harness = false

# OCCT's DRAW scripts that use Tcl (scripts/), run on a Tcl interpreter, one trial each.
[[test]]
name = "draw_tcl"
harness = false

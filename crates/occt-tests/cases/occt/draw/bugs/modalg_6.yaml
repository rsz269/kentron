  repo: https://github.com/Open-Cascade-SAS/OCCT
  git_hash: 3d097a0328e71b826377d4814ab05ec3c3d23871
  file: tests/bugs/modalg_6/bug28284_3
build:
  - b1: {box: {size: [10, 10, 10]}}
  - b1_1: {select: {of: b1, shell: [5.0, 5.0, 5.0], area: 600.0}}
  - b2: {empty: "solid"}
  - b2: {add: {to: b2, shape: b1_1}}
  - rcom: {intersection: {object: b1, tool: b2}}
  - check: {count: rcom, eq: {solids: 1}}
  - rfuse: {union: {object: b1, tool: b2}}
  - check: {count: rfuse, eq: {solids: 1}}
  - rcut: {difference: {object: b1, tool: b2}}
  - check: {count: rcut, eq: {solids: 0}}
  - rtuc: {difference: {object: b2, tool: b1}}
checks:
  - {count: rcut, eq: {solids: 0}}
---

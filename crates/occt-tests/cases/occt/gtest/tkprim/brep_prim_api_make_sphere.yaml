# OCCT GTests moved from crates/occt-tests/tests/gtest_tkprim by hand.
case: full_sphere
ported_from:
  project: OCCT
  repo: https://github.com/Open-Cascade-SAS/OCCT
  git_hash: 3d097a0328e71b826377d4814ab05ec3c3d23871
  file: src/ModelingAlgorithms/TKPrim/GTests/BRepPrimAPI_MakeSphere_Test.cxx
  test: BRepPrimAPI_MakeSphereTest.FullSphere
build:
  - shape: {sphere: {radius: 5}}
checks:
  - {valid: shape}
---
case: face_count
ported_from:
  project: OCCT
  repo: https://github.com/Open-Cascade-SAS/OCCT
  git_hash: 3d097a0328e71b826377d4814ab05ec3c3d23871
  file: src/ModelingAlgorithms/TKPrim/GTests/BRepPrimAPI_MakeSphere_Test.cxx
  test: BRepPrimAPI_MakeSphereTest.FaceCount
build:
  - shape: {sphere: {radius: 5}}
checks:
  - {count: shape, occurrences: true, eq: {faces: 1}}
---
case: volume
ported_from:
  project: OCCT
  repo: https://github.com/Open-Cascade-SAS/OCCT
  git_hash: 3d097a0328e71b826377d4814ab05ec3c3d23871
  file: src/ModelingAlgorithms/TKPrim/GTests/BRepPrimAPI_MakeSphere_Test.cxx
  test: BRepPrimAPI_MakeSphereTest.Volume
build:
  - shape: {sphere: {radius: 5}}
checks:
  - {volume: shape, eq: "4/3*pi*5^3", abs: 0.01}
---
case: partial_sphere_angle_limited
ported_from:
  project: OCCT
  repo: https://github.com/Open-Cascade-SAS/OCCT
  git_hash: 3d097a0328e71b826377d4814ab05ec3c3d23871
  file: src/ModelingAlgorithms/TKPrim/GTests/BRepPrimAPI_MakeSphere_Test.cxx

case: partial_torus_zero_to180
ported_from:
  project: OCCT
  repo: https://github.com/Open-Cascade-SAS/OCCT
  git_hash: 3d097a0328e71b826377d4814ab05ec3c3d23871
  file: src/ModelingAlgorithms/TKPrim/GTests/BRepPrimAPI_MakeTorus_Test.cxx
  test: BRepPrimAPI_MakeTorusTest.PartialTorus_ZeroTo180
notes:
  - "Equal end heights. OCCT asserts these partial tori are invalid, documenting a known limitation of its implementation (a degenerate edge on the axis). The cross-section is well defined (the region between the arc and its chord; OCCT builds it for a full revolution), so kentron expects a valid solid."
expect: not_done
build:
  - shape: {torus: {major: 10, minor: 2, tube: [0, 180], angle: 45}}
checks:
  - {valid: shape}
---

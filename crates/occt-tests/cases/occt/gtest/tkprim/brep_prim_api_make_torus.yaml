case: root_cause_height_ordering_assumption
ported_from:
  project: OCCT
  repo: https://github.com/Open-Cascade-SAS/OCCT
  git_hash: 3d097a0328e71b826377d4814ab05ec3c3d23871
  file: src/ModelingAlgorithms/TKPrim/GTests/BRepPrimAPI_MakeTorus_Test.cxx
  test: BRepPrimAPI_MakeTorusTest.RootCause_HeightOrderingAssumption
notes:
  - "The order of the cross-section's end heights: increasing, decreasing (bug 23612) and equal (where OCCT expects an invalid result, kentron a valid one) must work."
expect: not_done
build:
  - increasing: {torus: {major: 10, minor: 2, tube: [-90, 90], angle: 45}}
  - decreasing: {torus: {major: 10, minor: 2, tube: [90, 270], angle: 45}}
  - equal: {torus: {major: 10, minor: 2, tube: [45, 135], angle: 45}}
checks:
  - {valid: increasing}
  - {valid: decreasing}
  - {valid: equal}

case: topology_counts
ported_from:
  project: OCCT
  repo: https://github.com/Open-Cascade-SAS/OCCT
  git_hash: 3d097a0328e71b826377d4814ab05ec3c3d23871
  file: src/ModelingAlgorithms/TKPrim/GTests/BRepPrimAPI_MakeBox_Test.cxx
  test: BRepPrimAPI_MakeBoxTest.TopologyCounts
notes:
  - "Counts of uses, as TopExp_Explorer counts them: 12 edges x 2 faces, 8 vertices x 6 faces."
build:
  - shape: {box: {size: [10, 20, 30]}}
checks:
  - {count: shape, occurrences: true, eq: {faces: 6, edges: 24, vertices: 48}}

# STEP files from BRL-CAD's sources (see crates/occt-tests/README.md), checked against OCCT's reading of them.
case: nist_mbe_pmi_1
ported_from:
  project: BRL-CAD
  repo: https://github.com/BRL-CAD/brlcad
  file: db/nist/NIST_MBE_PMI_1.stp
notes:
  - "NIST MBE PMI test part 1 (a solid of 113 faces). Expected values: OCCT's reading of the file (DRAW stepread; sprops/vprops at 1e-9; nbshapes)."
build:
  - result: {load: {step: "NIST_MBE_PMI_1.stp"}}
checks:
  - {valid: result}
  - {count: result, eq: {faces: 113, solids: 1, shells: 1, edges: 314}}
  - {area: result, eq: 807327, rel: 1.0e-4}
  - {volume: result, eq: 1.46431e+07, rel: 1.0e-4}
---

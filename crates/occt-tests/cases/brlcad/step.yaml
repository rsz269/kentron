case: plate_mode_samples_creo
ported_from:
  project: BRL-CAD
  repo: https://github.com/BRL-CAD/brlcad
  file: src/libbrep/tests/plate_mode_samples_creo.stp
notes:
  - "surfaces bounded by curves on them (CURVE_BOUNDED_SURFACE) in a geometric set, exported by Creo, angles in degrees. Expected values: OCCT's reading of the file (DRAW stepread; sprops/vprops at 1e-9; nbshapes)."
  - "Edges not counted: the file bounds adjacent faces by the same trimmed curves, which kentron makes one shared edge and OCCT one edge per face (64 edges against OCCT's 86)."
build:
  - result: {load: {step: "plate_mode_samples_creo.stp"}}
checks:
  - {valid: result}
  - {count: result, eq: {faces: 22, shells: 0}}
  - {area: result, eq: 6.60902e+09, rel: 1.0e-4}
---

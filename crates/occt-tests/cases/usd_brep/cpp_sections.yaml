      object: b
      tool: h
- top:
    select:
      of: s
      face: [5, 5, 10]
      area: 100 - 4*pi
- l:
    edge:
      from: [5, 5, -5]
      to: [5, 5, 15]
- result:
    section:
      object: l
      tool: top
checks:
- count: result
  eq:
    vertices: 0

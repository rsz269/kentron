case: rounded_box_cut_by_a_plane
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmBrep.cpp
  test: TestSmCut
notes:
- 'usd-brep''s cut by the plane z = 7, as a difference: the volume is the rounded end and the straight run up to
  7.'
params:
  hx: 2.5
  hy: 5
  hz: 7.5
  r: 0.5
brute:
  rounded: (np.maximum(abs(x-hx)-(hx-r),0)**2 + np.maximum(abs(y-hy)-(hy-r),0)**2 + np.maximum(abs(z-hz)-(hz-r),0)**2
    <= r*r)
  result:
    test: (np.maximum(abs(x-hx)-(hx-r),0)**2 + np.maximum(abs(y-hy)-(hy-r),0)**2 + np.maximum(abs(z-hz)-(hz-r),0)**2
      <= r*r) & (z <= 7)
    box:
    - - 0
      - 0
      - 0
    - - 5
      - 10
      - 7
build:
- s:
    box:
      size: [5, 10, 15]
      corner: [0, 0, 0]
- e0:
    select:
      of: s
      edge: [0, 0, 7.5]
- e1:
    select:
      of: s
      edge: [0, 10, 7.5]
- e2:
    select:
      of: s
      edge: [5, 0, 7.5]
- e3:
    select:
      of: s
      edge: [5, 10, 7.5]
- e4:
    select:
      of: s
      edge: [2.5, 0, 0]
- e5:
    select:
      of: s
      edge: [2.5, 0, 15]
- e6:
    select:
      of: s
      edge: [2.5, 10, 0]
- e7:
    select:
      of: s
      edge: [2.5, 10, 15]
- e8:
    select:
      of: s
      edge: [0, 5.0, 0]
- e9:
    select:
      of: s
      edge: [0, 5.0, 15]
- e10:
    select:
      of: s
      edge: [5, 5.0, 0]
- e11:
    select:
      of: s
      edge: [5, 5.0, 15]
- rounded:
    fillet:
      shape: s
      edges: [e0, e1, e2, e3, e4, e5, e6, e7, e8, e9, e10, e11]
      radius: 0.5
- above:
    box:
      size: [40, 40, 40]
      corner: [-20, -20, 7]
- result:
    difference:
      object: rounded
      tool: above
checks:
- valid: result
- count: result
  eq:
    solids: 1
- volume: result
  eq: (4.0*9.0*14.0 + 2*0.5*(4.0*9.0 + 9.0*14.0 + 14.0*4.0) + pi*0.5^2*(4.0 + 9.0 + 14.0) + 4/3*pi*0.5^3 - (50 -
    (4 - pi)*0.25)*14)/2 + (50 - (4 - pi)*0.25)*6.5
  rel: 1.0e-06
- bounds: result
  eq: [[0, 0, 0], [5, 10, 7]]
  abs: 1.0e-06

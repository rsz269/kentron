# Translated from usd-brep's tests into kentron's case format, with the checks strengthened:
# changed from the originals as each case's notes say. See crates/occt-tests/README.md.
case: section_of_a_rounded_box
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmIntersectors.cpp
  test: TestSmIntersectBrepWithPlane
notes:
- 'A rounded rectangle: straight sides and a circle of radius 0.5. usd-brep checks the call.'
build:
- s:
    box:
      size: [5, 10, 15]
      corner: [0, 0, 0]
- e0:
    select:
      of: s
      edge: [0, 0, 7.5]
- e1:
    select:
      of: s
      edge: [0, 10, 7.5]
- e2:
    select:
      of: s
      edge: [5, 0, 7.5]
- e3:
    select:
      of: s
      edge: [5, 10, 7.5]
- e4:
    select:
      of: s
      edge: [2.5, 0, 0]
- e5:
    select:
      of: s
      edge: [2.5, 0, 15]
- e6:
    select:
      of: s
      edge: [2.5, 10, 0]
- e7:
    select:
      of: s
      edge: [2.5, 10, 15]
- e8:
    select:
      of: s
      edge: [0, 5.0, 0]
- e9:
    select:
      of: s
      edge: [0, 5.0, 15]
- e10:
    select:
      of: s
      edge: [5, 5.0, 0]
- e11:
    select:
      of: s
      edge: [5, 5.0, 15]
- rounded:
    fillet:
      shape: s
      edges: [e0, e1, e2, e3, e4, e5, e6, e7, e8, e9, e10, e11]
      radius: 0.5
- pw:
    polyline:
      points: [[-20, -20, 7], [20, -20, 7], [20, 20, 7], [-20, 20, 7], [-20, -20, 7]]
- p:
    face:
      wire: pw
- result:
    section:
      object: rounded
      tool: p
checks:
- length: result
  eq: 2*(4 + 9) + pi
  rel: 1.0e-06
---
case: section_of_a_box_and_a_sphere
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmIntersectors.cpp
  test: TestSmIntersectBreps
notes:
- Four arcs, one on each of the box's faces x = 0, x = 5, y = 0, y = 10, in closed form.
build:
- a:
    box:
      size: [5, 10, 15]
      corner: [0, 0, 0]
- b:
    sphere:
      radius: 10
      frame:
        origin: [3, 5, 0]
- result:
    section:
      object: a
      tool: b
checks:
- length: result
  eq: sqrt(91)*(pi - 2*acos(5/sqrt(91))) + sqrt(96)*(pi - 2*acos(5/sqrt(96))) + 2*sqrt(75)*(pi - acos(3/sqrt(75))
    - acos(2/sqrt(75)))
  rel: 1.0e-06
---
case: section_circle_crossing_a_tilted_plane
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmIntersectors.cpp
  test: TestSmIntersectCurveSurface
build:
- cc:
    circle:
      center: [5, 5, 0]
      normal: [0, 0, 1]
      radius: 3
- ce:
    edge:
      curve: cc
- fw:
    polyline:
      points: [[0, 0, -5], [10, 0, -5], [10, 10, 5], [0, 10, 5], [0, 0, -5]]
- f:
    face:
      wire: fw
- result:
    section:
      object: ce
      tool: f
- p:
    vertex:
      at: [2, 5, 0]
- q:
    vertex:
      at: [8, 5, 0]
checks:
- count: result
  eq:
    vertices: 2
- distance: [p, result]
  eq: 0
  abs: 1.0e-07
- distance: [q, result]
  eq: 0
  abs: 1.0e-07
---

case: revolve_segment_three_repetitions
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestSweeps.test_rotational_sweep_with_repetitions
notes:
- 'Upstream revolves by 120 degrees three times: here once by 360.'
build:
- s:
    edge:
      from: [5, 0, 0]
      to: [5, 0, 10]
- result:
    revolve:
      profile: s
      axis:
        origin: [0, 0, 0]
        direction: z
      angle: 360
checks:
- area: result
  eq: 100*pi
  rel: 1.0e-06

case: offset_band_of_a_square
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestCapEndsAndOffsetType.test_create_offset_profile_band_with_enum
notes:
- 'Rounded outside, sharp inside. usd-brep''s band has this area (79.1416), which its test does not check: its create_offset_profile
  makes the band in one step, so that leg does not run here.'
build:
- w:
    polyline:
      points: [[0, 0, 0], [10, 0, 0], [10, 10, 0], [0, 10, 0], [0, 0, 0]]
- ow:
    offset_wire:
      shape: w
      distance: 1
- iw:
    offset_wire:
      shape: w
      distance: -1
- o:
    face:
      wire: ow
- i:
    face:
      wire: iw
- result:
    difference:
      object: o
      tool: i
checks:
- area: result
  eq: 100 + 40 + pi - 64
  rel: 1.0e-06
- bounds: result
  eq: [[-1, -1, 0], [11, 11, 0]]
  abs: 1.0e-06

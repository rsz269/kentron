# Translated from usd-brep's tests into kentron's case format, with the checks strengthened:
# changed from the originals as each case's notes say. See crates/occt-tests/README.md.
case: pipe_tangent_line_arc_line
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestSweeps.test_planar_path_sweep_tangent_line_arc_line_is_material
notes:
- 'usd-brep allows 1%: Pappus''s value is held to 1e-5. The arc is usd-brep''s rational quadratic.'
brute:
  result:
    test: (((x+16.3)**2+(z-62.5)**2<=9)&(y>=3)&(y<=33)) | ((np.sqrt((y-33)**2+(z-66.5)**2)-4)**2+(x+16.3)**2<=9)&(y>=33)&(z<=66.5)
      | (((x+16.3)**2+(y-37)**2<=9)&(z>=66.5)&(z<=69.5))
    box:
    - - -19.3
      - 3
      - 59.5
    - - -13.3
      - 40
      - 69.5
build:
- dc:
    circle:
      center: [-16.3, 3, 62.5]
      normal: [0, 1, 0]
      radius: 3
- de:
    edge:
      curve: dc
- dw:
    wire:
      edges: [de]
- d:
    face:
      wire: dw
- a:
    edge:
      from: [-16.3, 3, 62.5]
      to: [-16.3, 33, 62.5]
- c:
    bspline:
      degree: 2
      knots: [[0, 3], [1, 3]]
      poles: [[-16.3, 33, 62.5], [-16.3, 37, 62.5], [-16.3, 37, 66.5]]
      weights: [1, sqrt(0.5), 1]
- b:
    edge:
      curve: c
- e:
    edge:
      from: [-16.3, 37, 66.5]
      to: [-16.3, 37, 69.5]
- spine:
    wire:
      edges: [a, b, e]
- result:
    pipe:
      profile: d
      spine: spine
checks:
- valid: result
- count: result
  eq:
    solids: 1
- volume: result
  eq: 9*pi*(33 + 2*pi)
  rel: 1.0e-05
---
case: pipe_closed_square_path
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestSweeps.test_closed_planar_path_uses_mitered_transitions_and_ignores_caps
notes:
- 'Mitred corners keep a pipe''s volume at its section times its path: usd-brep allows 2%.'
brute:
  result:
    test: ((y**2+z**2<=1)&(x>=y)&(x<=10-y)) | (((y-10)**2+z**2<=1)&(x>=10-y)&(x<=y)) | (((x-10)**2+z**2<=1)&(y>=10-x)&(y<=x))
      | ((x**2+z**2<=1)&(y>=x)&(y<=10-x))
    box:
    - - -1
      - -1
      - -1
    - - 11
      - 11
      - 1
build:
- dc:
    circle:
      center: [0, 0, 0]
      normal: [1, 0, 0]
      radius: 1
- de:
    edge:
      curve: dc
- dw:
    wire:
      edges: [de]
- d:
    face:
      wire: dw
- s0:
    edge:
      from: [0, 0, 0]
      to: [10, 0, 0]
- s1:
    edge:
      from: [10, 0, 0]
      to: [10, 10, 0]
- s2:
    edge:
      from: [10, 10, 0]
      to: [0, 10, 0]
- s3:
    edge:
      from: [0, 10, 0]
      to: [0, 0, 0]
- spine:
    wire:
      edges: [s0, s1, s2, s3]
- result:
    pipe:
      profile: d
      spine: spine
      corner: mitred
checks:
- valid: result
- count: result
  eq:
    faces: 4
- volume: result
  eq: 40*pi
  rel: 1.0e-05
---

case: extrude_nested_profiles
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestSweeps.test_planar_path_sweep_uses_nested_profile_parity_for_material
notes:
- 'Upstream''s even/odd nesting of three circles, built here as an annulus and a disc: the result is two solids.
  It allows 2%.'
brute:
  result:
    test: (z>=0)&(z<=10)&(((x*x+y*y<=9)&(x*x+y*y>=4))|(x*x+y*y<=1))
    box:
    - - -3
      - -3
      - 0
    - - 3
      - 3
      - 10
build:
- ac:
    circle:
      center: [0, 0, 0]
      normal: [0, 0, 1]
      radius: 3
- ae:
    edge:
      curve: ac
- aw:
    wire:
      edges: [ae]
- a:
    face:
      wire: aw
- bc:
    circle:
      center: [0, 0, 0]
      normal: [0, 0, 1]
      radius: 2
- be:
    edge:
      curve: bc
- bw:
    wire:
      edges: [be]
- b:
    face:
      wire: bw
- cc:
    circle:
      center: [0, 0, 0]
      normal: [0, 0, 1]
      radius: 1
- ce:
    edge:
      curve: cc
- cw:
    wire:
      edges: [ce]
- c:
    face:
      wire: cw
- ring:
    difference:
      object: a
      tool: b
- both:
    compound:
      of: [ring, c]
- result:
    extrude:
      profile: both
      by: [0, 0, 10]
checks:
- count: result
  eq:
    solids: 2
- volume: result
  eq: 60*pi
  rel: 1.0e-06
---
case: extrude_open_profile_stays_a_sheet
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestSweeps.test_planar_path_sweep_open_profile_stays_sheet_with_both_caps
build:
- p:
    polyline:
      points: [[-1, -1, 0], [1, -1, 0], [1, 1, 0], [-1, 1, 0]]
- result:
    extrude:
      profile: p
      by: [0, 0, 10]
checks:
- count: result
  eq:
    faces: 3
    solids: 0
- area: result
  eq: 60
  rel: 1.0e-06

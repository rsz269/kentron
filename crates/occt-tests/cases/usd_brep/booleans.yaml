# Translated from usd-brep's tests into kentron's case format, with the checks strengthened:
# changed from the originals as each case's notes say. See crates/occt-tests/README.md.
case: two_boxes_union
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestBooleans.test_boolean_union
notes:
- 'usd-brep only checks the number of faces against a bound: the volume added, and the number exact.'
build:
- a:
    box:
      size: [10, 10, 10]
      corner: [0, 0, 0]
- b:
    box:
      size: [10, 10, 10]
      corner: [5, 5, 5]
- result:
    union:
      object: a
      tool: b
checks:
- valid: result
- count: result
  eq:
    solids: 1
- count: result
  eq:
    faces: 12
- volume: result
  eq: 1875
  rel: 1.0e-06
---

case: three_cylinders_union_xyz
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestBooleans.test_booleans_of_three_crossing_equal_radius_cylinders
build:
- base:
    cylinder:
      radius: 1
      height: 4
      frame:
        origin: [0.0, 0, -2]
- x:
    rotate:
      shape: base
      axis:
        origin: [0, 0, 0]
        direction: [0, 1, 0]
      angle: 90
- y:
    rotate:
      shape: base
      axis:
        origin: [0, 0, 0]
        direction: [1, 0, 0]
      angle: 90
- z:
    cylinder:
      radius: 1
      height: 4
      frame:
        origin: [0.0, 0, -2]
- ab:
    union:
      object: x
      tool: y
- result:
    union:
      object: ab
      tool: z
checks:
- valid: result
- count: result
  eq:
    solids: 1
- volume: result
  eq: 12*pi - 16 + 8*(2 - sqrt(2))
  rel: 1.0e-06
---

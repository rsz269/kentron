case: mirrored_copy_union
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestBooleans.test_booleans_with_mirrored_copy_sharing_trimmed_coplanar_faces
notes:
- 'The expected volumes in closed form: usd-brep takes the part''s from its own kernel.'
build:
- bx:
    box:
      size: [30, 10, 6]
      corner: [0, -5, 0]
- cy:
    cylinder:
      radius: 8
      height: 6
      frame:
        origin: [0, 0, 0]
- p:
    union:
      object: bx
      tool: cy
- q:
    mirror:
      shape: p
      origin: [0, 0, 0]
      normal: x
- result:
    union:
      object: p
      tool: q
checks:
- valid: result
- volume: result
  eq: 2*6*(300 + 64*pi - (5*sqrt(39) + 64*asin(5/8))) - pi*64*6
  rel: 1.0e-06
- volume: p
  eq: 6*(300 + 64*pi - (5*sqrt(39) + 64*asin(5/8)))
  rel: 1.0e-06
---

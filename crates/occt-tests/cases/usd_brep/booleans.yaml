case: tangent_sphere_cut_dimple_intersection
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestBooleans.test_intersection_deleting_sphere_cut_tangent_to_a_face
notes:
- 'A sphere cut tangent to a box face: its face has a loop of one vertex. usd-brep compares with its own difference:
  the volumes here are those SMLib, OCCT and sampling the definition agree on.'
build:
- p0:
    box:
      size: [4.5, 3.5, 2.5]
      corner: [0, 0, 0]
- t1:
    box:
      size: [1, 3, 2.5]
      corner: [3.5, 0, 0.75]
- p1:
    difference:
      object: p0
      tool: t1
- t2:
    box:
      size: [0.5, 2, 1]
      corner: [3.25, 1, 1]
- p2:
    difference:
      object: p1
      tool: t2
- b0:
    cylinder:
      radius: 1.25
      height: 1.5
      frame:
        origin: [0, 0, -0.75]
- b1:
    rotate:
      shape: b0
      axis:
        origin: [0, 0, 0]
        direction: [1, 0, 0]
      angle: 90
- b2:
    translate:
      shape: b1
      by: [3.5, 0.5, 0.5]
- p3:
    union:
      object: p2
      tool: b2
- sp:
    sphere:
      radius: 1
      frame:
        origin: [0.5, 2.5, 1.5]
- p:
    difference:
      object: p3
      tool: sp
- tool:
    cylinder:
      radius: 1.25
      height: 2
      frame:
        origin: [2, 3, -1]
- result:
    intersection:
      object: p
      tool: tool
checks:
- valid: result
- volume: result
  eq: 3.55695
  rel: 1.0e-05
- bounds: result
  eq: [[0.75, 1.75, 0], [3.25, 3.5, 1]]
  abs: 1.0e-06
---

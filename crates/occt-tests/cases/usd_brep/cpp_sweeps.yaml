# Translated from usd-brep's tests into kentron's case format, with the checks strengthened:
# changed from the originals as each case's notes say. See crates/occt-tests/README.md.
case: revolve_semicircle_to_a_sphere
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmPrimitives.cpp
  test: TestSmCreateRotationalSweep
notes:
- 'With TestSmCreateSurfaceRevolutionSphere. usd-brep only checks that the call succeeds: the measures added, in
  closed form.'
build:
- c:
    circle:
      center: [0, 0, 0]
      normal: [0, 0, 1]
      radius: 10
- arc:
    edge:
      curve: c
      range: [0, pi]
- result:
    revolve:
      profile: arc
      axis:
        origin: [0, 0, 0]
        direction: [1, 0, 0]
      angle: 360
checks:
- area: result
  eq: 400*pi
  rel: 1.0e-06
- bounds: result
  eq: [[-10, -10, -10], [10, 10, 10]]
  abs: 1.0e-06
---
case: extrude_half_disc
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmPrimitives.cpp
  test: TestSmCreateLinearSweep
notes:
- 'usd-brep only checks that the call succeeds: the measures added, in closed form.'
brute:
  result:
    test: (x*x + y*y <= 100) & (y >= 0) & (z >= 0) & (z <= 10)
    box:
    - - -10
      - 0
      - 0
    - - 10
      - 10
      - 10
build:
- c:
    circle:
      center: [0, 0, 0]
      normal: [0, 0, 1]
      radius: 10
- arc:
    edge:
      curve: c
      range: [0, pi]
- line:
    edge:
      from: [-10, 0, 0]
      to: [10, 0, 0]
- w:
    wire:
      edges: [arc, line]
- f:
    face:
      wire: w
- result:
    extrude:
      profile: f
      by: [0, 0, 10]
checks:
- valid: result
- count: result
  eq:
    solids: 1
- volume: result
  eq: 500*pi
  rel: 1.0e-06
- area: result
  eq: 100*pi + 100*pi + 200
  rel: 1.0e-06
- bounds: result
  eq: [[-10, 0, 0], [10, 10, 10]]
  abs: 1.0e-06
---

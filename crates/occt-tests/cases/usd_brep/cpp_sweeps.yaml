    circle:
      center: [0, 0, 0]
      normal: [0, 0, 1]
      radius: 2
- oe:
    edge:
      curve: oc
- ow:
    wire:
      edges: [oe]
- o:
    face:
      wire: ow
- ic:
    circle:
      center: [0, 0, 0]
      normal: [0, 0, 1]
      radius: 1
- ie:
    edge:
      curve: ic
- iw:
    wire:
      edges: [ie]
- i:
    face:
      wire: iw
- f:

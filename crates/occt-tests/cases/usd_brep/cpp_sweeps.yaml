case: drafted_square_leaning_in
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmBrep.cpp
  test: TestSmTaperExtrude
notes:
- 'usd-brep only checks that the call succeeds: the measures added, in closed form.'
params:
  t: tan(5*pi/180)
brute:
  result:
    test: (z>=0)&(z<=10)&(np.maximum(abs(x-5),abs(y-5))<=5-z*t)
    box:
    - - 0
      - 0
      - 0
    - - 10
      - 10
      - 10
build:
- qw:
    polyline:
      points: [[0, 0, 0], [10, 0, 0], [10, 10, 0], [0, 10, 0], [0, 0, 0]]
- q:
    face:
      wire: qw
- result:
    extrude:
      profile: q
      by: [0, 0, 10]
      angle: 5
checks:
- valid: result
- count: result
  eq:
    solids: 1
- count: result
  eq:
    faces: 6
- volume: result
  eq: 1000 - 2000*tan(5*pi/180) + 4000/3*tan(5*pi/180)^2
  rel: 1.0e-06
- bounds: result
  eq: [[0, 0, 0], [10, 10, 10]]
  abs: 1.0e-06
---
case: drafted_rectangle_leaning_out
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmPrimitives.cpp
  test: TestSmCreateDraftSweep
notes:
- 'usd-brep only checks that the call succeeds: the measures added, in closed form.'
- 'OCCT''s LocOpe_DPrism, leaning out, adds a face at each corner (10 faces, volume 2270.48): the closed form is
  of the sides meeting, as SMLib''s and the sampled volume have it, and its face count is left out, SMLib splitting
  the sides into 14.'
params:
  t: tan(5*pi/180)
brute:
  result:
    test: (z>=0)&(z<=10)&(abs(x-5)<=5+z*t)&(abs(y-10)<=10+z*t)
    box:
    - - -1
      - -1
      - 0
    - - 11
      - 21
      - 10
build:
- qw:
    polyline:
      points: [[0, 0, 0], [10, 0, 0], [10, 20, 0], [0, 20, 0], [0, 0, 0]]
- q:
    face:
      wire: qw
- result:
    extrude:
      profile: q
      by: [0, 0, 10]
      angle: -5
checks:
- valid: result
- count: result
  eq:
    solids: 1
- volume: result
  eq: 2000 + 3000*tan(5*pi/180) + 4000/3*tan(5*pi/180)^2
  rel: 1.0e-06
---
case: ruled_loft_of_three_circles
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmPrimitives.cpp
  test: TestSmCreateSkinPrimitive
brute:
  result:
    test: (x*x + y*y <= np.where(z < 5, 5 + 0.6*z, 13 - z)**2) & (z >= 0) & (z <= 10)
    box:
    - - -8
      - -8
      - 0
    - - 8
      - 8
      - 10
build:
- o0c:
    circle:
      center: [0, 0, 0]
      normal: [0, 0, 1]
      radius: 5
- o0e:
    edge:
      curve: o0c
- o0w:
    wire:
      edges: [o0e]
- o1c:
    circle:
      center: [0, 0, 5]
      normal: [0, 0, 1]
      radius: 8
- o1e:
    edge:
      curve: o1c
- o1w:
    wire:
      edges: [o1e]
- o2c:
    circle:
      center: [0, 0, 10]
      normal: [0, 0, 1]
      radius: 3
- o2e:
    edge:
      curve: o2c
- o2w:
    wire:
      edges: [o2e]
- result:
    loft:
      sections: [o0w, o1w, o2w]
      solid: true
      ruled: true
checks:
- valid: result
- count: result
  eq:
    solids: 1
- volume: result
  eq: 1130*pi/3
  rel: 1.0e-06
- bounds: result
  eq: [[-8, -8, 0], [8, 8, 10]]
  abs: 1.0e-06
---
case: ruled_loft_annulus
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmPrimitives.cpp
  test: TestSmCreateSkinPrimitive
notes:
- 'usd-brep lofts two loops per section: here the outer loft less the inner one.'
brute:
  a:
    test: (x*x + y*y <= np.where(z < 5, 5 + 0.6*z, 13 - z)**2) & (z >= 0) & (z <= 10)
    box: &id001
    - - -8
      - -8
      - 0
    - - 8
      - 8
      - 10
  b:
    test: (x*x + y*y < np.where(z < 5, 2 + 0.4*z, 7 - 0.6*z)**2)
    box: *id001
  result:
    test: ((x*x + y*y <= np.where(z < 5, 5 + 0.6*z, 13 - z)**2) & (z >= 0) & (z <= 10)) & ~((x*x + y*y < np.where(z
      < 5, 2 + 0.4*z, 7 - 0.6*z)**2))
    box: *id001
build:
- o0c:
    circle:
      center: [0, 0, 0]
      normal: [0, 0, 1]
      radius: 5
- o0e:
    edge:
      curve: o0c
- o0w:
    wire:

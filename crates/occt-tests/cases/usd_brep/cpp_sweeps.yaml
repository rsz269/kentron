      points: [[0, -1, -0.5], [0, 1, -0.5], [0, 1, 0.5], [0, -1, 0.5], [0, -1, -0.5]]
- r:
    face:
      wire: rw
- spine:
    edge:
      from: [0, 0, 0]
      to: [20, 0, 0]
- result:
    pipe:
      profile: r
      spine: spine
checks:

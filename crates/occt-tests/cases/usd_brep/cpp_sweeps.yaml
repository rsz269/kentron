case: pipe_along_a_bent_path
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmBrep.cpp
  test: TestSmSweepAlongPlanarPath
notes:
- 'usd-brep allows 2%: the mitred pipe''s volume is the closed form exactly.'
params:
  n1: sin(pi/8)
  n3: cos(pi/8)
brute:
  result:
    test: ((x*x+y*y<=1)&(z>=0)&(((z-10)*n3+x*n1)<=0)) | (((x**2+y**2+(z-10)**2-((x+z-10)/sqrt(2))**2)<=1)&(((z-10)*n3+x*n1)>=0)&((x+z-10)/sqrt(2)<=sqrt(50)))
    box:
    - - -2
      - -1.5
      - -1
    - - 7
      - 1.5
      - 17
build:
- dc:
    circle:
      center: [0, 0, 0]
      normal: [0, 0, 1]
      radius: 1
- de:
    edge:
      curve: dc
- dw:
    wire:
      edges: [de]
- d:
    face:
      wire: dw
- l1:
    edge:
      from: [0, 0, 0]
      to: [0, 0, 10]
- l2:
    edge:
      from: [0, 0, 10]
      to: [5, 0, 15]
- spine:
    wire:
      edges: [l1, l2]
- result:
    pipe:
      profile: d
      spine: spine
      corner: mitred
checks:
- valid: result
- count: result
  eq:
    solids: 1
- count: result
  eq:
    faces: 4
- volume: result
  eq: pi*(10 + sqrt(50))
  rel: 1.0e-06

case: pipe_along_an_s_curve
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmBrep.cpp
  test: TestSmPipeSweep
notes:
- usd-brep's curve through these four points is this cubic Bezier. A pipe's volume is its section's area times the
  path's length (Pappus), the length here by midpoint quadrature at 2e6 points.
build:
- dc:
    circle:
      center: [0, 0, 0]
      normal: [1, 1, 0]
      radius: 1
- de:
    edge:
      curve: dc
- dw:
    wire:
      edges: [de]
- d:
    face:
      wire: dw
- b:
    bezier:
      poles: [[0, 0, 0], [5, 5, 0], [10, 0, 0], [15, 5, 0]]
- spine:
    edge:
      curve: b
- result:
    pipe:
      profile: d
      spine: spine
checks:
- valid: result
- count: result
  eq:
    solids: 1
- volume: result
  eq: pi*16.341441198371452
  rel: 1.0e-05

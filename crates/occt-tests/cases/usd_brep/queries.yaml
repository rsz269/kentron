  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestQueries.test_surface_closest_point
notes:
- usd-brep's 4 x 4 grid of points in z = 0 makes a surface that is this square.
build:
- rw:
    polyline:
      points: [[0.0, 0.0, 0], [15.0, 0.0, 0], [15.0, 15.0, 0], [0.0, 15.0, 0], [0.0, 0.0, 0]]
- r:
    face:
      wire: rw
- p:
    vertex:
      at: [5, 5, 3]
checks:
- distance: [p, r]
  eq: 3
  abs: 1.0e-06
---
case: distance_point_to_annulus_keeps_its_trims
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestQueries.test_surface_closest_point_ignores_owning_face_trims
notes:
- usd-brep checks that a surface's closest point ignores its face's trims (0). A shape's distance is to the face,
  so here the trims count.
build:
- ac:
    circle:
      center: [0, 0, 0]
      normal: [0, 0, 1]
      radius: 5
- ae:
    edge:
      curve: ac
- aw:
    wire:
      edges: [ae]
- a:
    face:
      wire: aw
- bc:
    circle:
      center: [0, 0, 0]
      normal: [0, 0, 1]
      radius: 2
- be:
    edge:
      curve: bc
- bw:
    wire:
      edges: [be]
- b:
    face:
      wire: bw
- result:
    difference:
      object: a
      tool: b
- p:
    vertex:
      at: [0, 0, 0]
checks:
- area: result
  eq: pi*21
  rel: 1.0e-06
- distance: [p, result]
  eq: 2
  abs: 1.0e-06
---

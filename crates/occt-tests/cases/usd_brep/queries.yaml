    intersection:
      object: a
      tool: b
checks:
- volume: i
  eq: 8
  rel: 1.0e-06
- contains: a
  points: [[3.5, 3.5, 3.5], [4.5, 4.5, 4.5], [4, 4, 4]]
  inside: true

case: face_with_a_hole_loops
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestTopologyAccessors.test_face_boundary_loops_order_orientation_and_outer_selection
notes:
- Upstream checks the loops' signed areas, 100 and -16.
build:
- ow:
    polyline:
      points: [[-5, -5, 0], [5, -5, 0], [5, 5, 0], [-5, 5, 0], [-5, -5, 0]]
- o:
    face:
      wire: ow
- iw:
    polyline:
      points: [[-2, -2, 0], [2, -2, 0], [2, 2, 0], [-2, 2, 0], [-2, -2, 0]]
- i:
    face:
      wire: iw
- result:
    difference:
      object: o
      tool: i
checks:
- area: result
  eq: 84
  rel: 1.0e-06
- count: result
  eq:
    wires: 2
    faces: 1
    edges: 8
---
case: disc_area_across_a_circles_knots
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestTopologyAccessors.test_face_area_across_trim_curve_knots
build:
- resultc:
    circle:
      center: [0, 0, 0]
      normal: [0, 0, 1]
      radius: 5
- resulte:
    edge:
      curve: resultc
- resultw:
    wire:
      edges: [resulte]
- result:
    face:
      wire: resultw
checks:
- area: result
  eq: pi*25
  rel: 1.0e-06

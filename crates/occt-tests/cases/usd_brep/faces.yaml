case: sphere_wedge_face_centroid_90
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestTopologyAccessors.test_face_centroid_on_sphere_faces_with_poles
notes:
- The curved face of a wedge with poles, at r pi / 4a (sin a, 1 - cos a, 0).
build:
- s:
    sphere:
      radius: 5
      angle: 90
- f:
    select:
      of: s
      face: [2.5, 2.5, 0]
      area: 2*25*1.5707963267948966
checks:
- area: f
  eq: 2*25*1.5707963267948966
  rel: 1.0e-06
- centroid: f
  eq: [2.5, 2.5, 0]
  abs: 1.0e-06
---

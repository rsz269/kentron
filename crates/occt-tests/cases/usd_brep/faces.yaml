# Translated from usd-brep's tests into kentron's case format, with the checks strengthened:
# changed from the originals as each case's notes say. See crates/occt-tests/README.md.
case: box_face_areas
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestTopologyAccessors.test_face_area
notes:
- With test_face_centroid.
build:
- s:
    box:
      size: [10, 10, 10]
      corner: [0, 0, 0]
- f0:
    select:
      of: s
      face: [5, 5, 0]
- f1:
    select:
      of: s
      face: [5, 5, 10]
- f2:
    select:
      of: s
      face: [0, 5, 5]
- f3:
    select:
      of: s
      face: [10, 5, 5]
- f4:
    select:
      of: s
      face: [5, 0, 5]
- f5:
    select:
      of: s
      face: [5, 10, 5]
checks:
- area: f0
  eq: 100
  rel: 1.0e-06
- area: f1
  eq: 100
  rel: 1.0e-06
- area: f2
  eq: 100
  rel: 1.0e-06
- area: f3
  eq: 100
  rel: 1.0e-06
- area: f4
  eq: 100
  rel: 1.0e-06
- area: f5
  eq: 100
  rel: 1.0e-06
- centroid: f0
  eq: [5, 5, 0]
- centroid: f1
  eq: [5, 5, 10]
- centroid: f2
  eq: [0, 5, 5]
- centroid: f3
  eq: [10, 5, 5]
- centroid: f4
  eq: [5, 0, 5]
- centroid: f5
  eq: [5, 10, 5]
---
case: box_edge_lengths
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestTopologyAccessors.test_edge_length
build:
- s:
    box:
      size: [10, 7, 3]
      corner: [0, 0, 0]
- a:
    select:
      of: s
      edge: [5, 0, 0]
- b:
    select:
      of: s
      edge: [0, 3.5, 0]
- c:
    select:
      of: s
      edge: [0, 0, 1.5]
checks:
- length: a
  eq: 10
- length: b
  eq: 7
- length: c
  eq: 3
---
case: cylinder_cap_areas_radius_0_5
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestTopologyAccessors.test_face_area_reversed_orientation_circular_caps
notes:
- 'Both caps, one reversed: usd-brep''s used to report 0 for it.'
build:
- s:
    cylinder:
      radius: 0.5
      height: 2.0
      frame:
        origin: [0, 0, 0]
- lo:
    select:
      of: s
      face: [0, 0, 0]
- hi:
    select:
      of: s
      face: [0, 0, 2.0]
checks:
- area: lo
  eq: pi*0.5^2
  rel: 1.0e-06
- area: hi
  eq: pi*0.5^2
  rel: 1.0e-06
---

# Translated from usd-brep's tests into kentron's case format, with the checks strengthened:
# changed from the originals as each case's notes say. See crates/occt-tests/README.md.
case: round_every_edge
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestFillets.test_circular_fillet
notes:
- The volume in closed form and the 26 faces of the small box's case replace usd-brep's check that faces were added.
params:
  c: 5
  r: 1
brute:
  result: (np.maximum(abs(x-c)-(c-r),0)**2 + np.maximum(abs(y-c)-(c-r),0)**2 + np.maximum(abs(z-c)-(c-r),0)**2 <=
    r*r)
build:
- s:
    box:
      size: [10, 10, 10]
      corner: [0, 0, 0]
- e0:
    select:
      of: s
      edge: [0.0, 0.0, 5.0]
- e1:
    select:
      of: s
      edge: [10.0, 0.0, 5.0]
- e2:
    select:
      of: s
      edge: [0.0, 10.0, 5.0]
- e3:
    select:
      of: s
      edge: [10.0, 10.0, 5.0]
- e4:
    select:
      of: s
      edge: [5.0, 0.0, 0.0]
- e5:
    select:
      of: s
      edge: [5.0, 10.0, 0.0]
- e6:
    select:
      of: s
      edge: [5.0, 0.0, 10.0]
- e7:
    select:
      of: s
      edge: [5.0, 10.0, 10.0]
- e8:
    select:
      of: s
      edge: [0.0, 5.0, 0.0]
- e9:
    select:
      of: s
      edge: [10.0, 5.0, 0.0]
- e10:
    select:
      of: s
      edge: [0.0, 5.0, 10.0]
- e11:
    select:
      of: s
      edge: [10.0, 5.0, 10.0]
- result:
    fillet:
      shape: s
      edges: [e0, e1, e2, e3, e4, e5, e6, e7, e8, e9, e10, e11]
      radius: 1
checks:
- valid: result
- count: result
  eq:
    faces: 26
- volume: result
  eq: (10 - 2*1)^3 + 6*(10 - 2*1)^2*1 + 3*(10 - 2*1)*pi*1^2 + 4/3*pi*1^3
  rel: 1.0e-06
- bounds: result
  eq: [[0, 0, 0], [10, 10, 10]]
  abs: 1.0e-06
---

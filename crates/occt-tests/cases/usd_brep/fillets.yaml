case: chamfer_every_edge
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestFillets.test_chamfer_fillet
notes:
- usd-brep's chamfer of width 1 is one of distance sqrt(2)/2 along each face. Upstream's check that faces were added
  becomes the shape's bounds; the volume is by sampling.
params:
  d: sqrt(2)/2
brute:
  result: s(x,y,z) & (abs(x-5)+abs(y-5)<=10-d) & (abs(y-5)+abs(z-5)<=10-d) & (abs(x-5)+abs(z-5)<=10-d)
build:
- s:
    box:
      size: [10, 10, 10]
      corner: [0, 0, 0]
- e0:
    select:
      of: s
      edge: [0.0, 0.0, 5.0]
- e1:
    select:
      of: s
      edge: [10.0, 0.0, 5.0]
- e2:
    select:
      of: s
      edge: [0.0, 10.0, 5.0]
- e3:
    select:
      of: s
      edge: [10.0, 10.0, 5.0]
- e4:
    select:
      of: s
      edge: [5.0, 0.0, 0.0]
- e5:
    select:
      of: s
      edge: [5.0, 10.0, 0.0]
- e6:
    select:
      of: s
      edge: [5.0, 0.0, 10.0]
- e7:
    select:
      of: s
      edge: [5.0, 10.0, 10.0]
- e8:
    select:
      of: s
      edge: [0.0, 5.0, 0.0]
- e9:
    select:
      of: s
      edge: [10.0, 5.0, 0.0]
- e10:
    select:
      of: s
      edge: [0.0, 5.0, 10.0]
- e11:
    select:
      of: s
      edge: [10.0, 5.0, 10.0]
- result:
    chamfer:
      shape: s
      edges: [e0, e1, e2, e3, e4, e5, e6, e7, e8, e9, e10, e11]
      distance: sqrt(2)/2
checks:
- valid: result
- count: result
  eq:
    solids: 1
- bounds: result
  eq: [[0, 0, 0], [10, 10, 10]]
  abs: 1.0e-06
---
case: remove_fillet_restores_box
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestFillets.test_remove_fillet_restores_box
brute:
  result: s(x,y,z)
build:
- s:
    box:
      size: [10, 10, 10]
      corner: [0, 0, 0]
- e:
    select:
      of: s
      edge: [10, 5, 10]
- r:
    fillet:
      shape: s
      edges: [e]
      radius: 2
- f:
    select:
      of: r
      face: [8 + 4/pi, 5, 8 + 4/pi]
- result:
    remove_faces:
      shape: r
      faces: [f]
checks:
- valid: result
- count: result
  eq:
    faces: 6
- volume: result
  eq: 1000
  rel: 1.0e-06

  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestFillets.test_fillet_radius_at_minimum_is_solid
notes:
- 8e-5 is usd-brep's smallest allowed radius on this box. Its check that the volume is above 0.99e-6 becomes the
  closed form.
params:
  c: 0.005
  r: 8.0e-05
brute:
  result: (np.maximum(abs(x-c)-(c-r),0)**2 + np.maximum(abs(y-c)-(c-r),0)**2 + np.maximum(abs(z-c)-(c-r),0)**2 <=
    r*r)
build:
- s:
    box:
      size: [0.01, 0.01, 0.01]
      corner: [0, 0, 0]
- e0:
    select:
      of: s
      edge: [0.0, 0.0, 0.005]
- e1:
    select:
      of: s
      edge: [0.01, 0.0, 0.005]
- e2:
    select:
      of: s
      edge: [0.0, 0.01, 0.005]
- e3:
    select:
      of: s
      edge: [0.01, 0.01, 0.005]
- e4:
    select:
      of: s
      edge: [0.005, 0.0, 0.0]
- e5:
    select:
      of: s
      edge: [0.005, 0.01, 0.0]
- e6:
    select:
      of: s
      edge: [0.005, 0.0, 0.01]
- e7:
    select:
      of: s
      edge: [0.005, 0.01, 0.01]
- e8:
    select:
      of: s
      edge: [0.0, 0.005, 0.0]
- e9:
    select:
      of: s
      edge: [0.01, 0.005, 0.0]
- e10:
    select:
      of: s
      edge: [0.0, 0.005, 0.01]
- e11:
    select:
      of: s
      edge: [0.01, 0.005, 0.01]
- result:
    fillet:
      shape: s
      edges: [e0, e1, e2, e3, e4, e5, e6, e7, e8, e9, e10, e11]
      radius: 8.0e-05
checks:
- valid: result
- volume: result
  eq: (0.01 - 2*8e-05)^3 + 6*(0.01 - 2*8e-05)^2*8e-05 + 3*(0.01 - 2*8e-05)*pi*8e-05^2 + 4/3*pi*8e-05^3
  rel: 1.0e-05

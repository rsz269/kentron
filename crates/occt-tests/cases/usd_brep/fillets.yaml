case: round_first_four_edges
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestFillets.test_fillet_edges
notes:
- 'usd-brep''s box.edges()[:4], named by position: its first four edges in its own order. The volume is checked
  by sampling.'
brute:
  result: s(x,y,z) & ~((x>9)&(z>9)&((x-9)**2+(z-9)**2>1)) & ~((y>9)&(z>9)&((y-9)**2+(z-9)**2>1)) & ~((x<1)&(z<1)&((x-1)**2+(z-1)**2>1))
    & ~((x<1)&(z>9)&((x-1)**2+(z-9)**2>1))
build:
- s:
    box:
      size: [10, 10, 10]
      corner: [0, 0, 0]
- e0:
    select:
      of: s
      edge: [10.0, 5.0, 10.0]
- e1:
    select:
      of: s
      edge: [5.0, 10.0, 10.0]
- e2:
    select:
      of: s
      edge: [0.0, 5.0, 0.0]
- e3:
    select:
      of: s
      edge: [0.0, 5.0, 10.0]
- result:
    fillet:
      shape: s
      edges: [e0, e1, e2, e3]
      radius: 1
checks:
- valid: result
- count: result
  eq:
    faces: 10
---
case: round_edge_radius_law
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestFillets.test_variable_radius_fillet
notes:
- The radius runs from 0.5 to 2 along the edge. The direction of the law along the edge is a kernel's choice, and
  the volume does not depend on it. Volume by sampling, the radius linear along the edge.
brute:
  result: s(x,y,z) & ~((x>10-(0.5+0.15*y))&(z>10-(0.5+0.15*y))&((x-10+(0.5+0.15*y))**2+(z-10+(0.5+0.15*y))**2>(0.5+0.15*y)**2))
build:
- s:
    box:
      size: [10, 10, 10]
      corner: [0, 0, 0]
- e:
    select:
      of: s
      edge: [10, 5, 10]
- result:
    fillet:
      shape: s
      edges: [{edge: e, law: [[0, 0.5], [1, 2]]}]
checks:
- valid: result
- count: result
  eq:
    faces: 7
---

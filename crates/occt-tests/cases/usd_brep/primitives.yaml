case: plane
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestPrimitives.test_create_plane
build:
- w:
    polyline:
      points: [[-5, -5, 0], [5, -5, 0], [5, 5, 0], [-5, 5, 0], [-5, -5, 0]]
- result:
    face:
      wire: w
checks:
- count: result
  eq:
    faces: 1
- area: result
  eq: 100
  rel: 1.0e-06
---
case: planar_circle
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestPrimitives.test_create_planar_circle
notes:
- 'usd-brep only checks that the shape has faces: volume, area and bounds added, in closed form.'
build:
- c:
    circle:
      center: [0, 0, 0]
      normal: [0, 0, 1]
      radius: 5
- e:
    edge:
      curve: c
- w:
    wire:
      edges: [e]
- result:
    face:
      wire: w
checks:
- count: result
  eq:
    faces: 1
- area: result
  eq: pi*25
  rel: 1.0e-06
---
case: pyramid
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestPrimitives.test_create_pyramid
notes:
- 'As a wedge closing to a point: its height along Y, its base''s corner at the origin. The volume in closed form
  replaces usd-brep''s check that it is positive.'
build:
- result:
    wedge:
      size: [10, 10, 10]
      top: [5, 5, 5, 5]
checks:
- valid: result
- count: result
  eq:
    faces: 5
    vertices: 5
- volume: result
  eq: 1000/3
  rel: 1.0e-06
---
case: cylindrical_box
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestPrimitives.test_create_cylindrical_box
notes:
- 'A quarter of a tube, built as the difference of two sectors with shared end planes. usd-brep only checks that
  the shape has faces: volume, area and bounds added, in closed form.'
build:
- o:
    cylinder:
      radius: 5
      height: 10
      frame:
        origin: [0, 0, 0]
      angle: 90
- i:
    cylinder:
      radius: 3
      height: 10
      frame:
        origin: [0, 0, 0]
      angle: 90
- result:
    difference:
      object: o
      tool: i
checks:
- valid: result
- count: result
  eq:
    solids: 1
- count: result
  eq:
    faces: 6
- volume: result
  eq: pi/4*(25 - 9)*10
  rel: 1.0e-06
- bounds: result
  eq: [[0, 0, 0], [5, 5, 10]]
  abs: 1.0e-06
---

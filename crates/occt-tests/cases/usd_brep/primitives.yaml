# Translated from usd-brep's tests into kentron's case format, with the checks strengthened:
# changed from the originals as each case's notes say. See crates/occt-tests/README.md.
case: box
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestPrimitives.test_create_box
build:
- result:
    box:
      size: [10, 10, 10]
      corner: [0, 0, 0]
checks:
- valid: result
- count: result
  eq:
    faces: 6
    edges: 12
    vertices: 8
    solids: 1
- volume: result
  eq: 1000
  rel: 1.0e-06
- area: result
  eq: 600
  rel: 1.0e-06
- bounds: result
  eq: [[0, 0, 0], [10, 10, 10]]
  abs: 1.0e-06
---
case: sphere
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestPrimitives.test_create_sphere
notes:
- 'usd-brep only checks that the shape has faces: volume, area and bounds added, in closed form.'
build:
- result:
    sphere:
      radius: 5
      frame:
        origin: [0, 0, 0]
checks:
- valid: result
- count: result
  eq:
    solids: 1
- volume: result
  eq: 4/3*pi*125
  rel: 1.0e-06
- area: result
  eq: 4*pi*25
  rel: 1.0e-06
- bounds: result
  eq: [[-5, -5, -5], [5, 5, 5]]
  abs: 1.0e-06
---
case: cone
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: source/SmPyLib/tests/test_omni_solid.py
  test: TestPrimitives.test_create_cone
notes:
- 'usd-brep only checks that the shape has faces: volume, area and bounds added, in closed form.'
build:
- result:
    cone:
      r1: 5
      r2: 2
      height: 10
checks:
- valid: result
- count: result
  eq:
    solids: 1
- volume: result
  eq: pi/3*10*(25 + 10 + 4)
  rel: 1.0e-06
- area: result
  eq: pi*(25 + 4) + pi*7*sqrt(109)
  rel: 1.0e-06
- bounds: result
  eq: [[-5, -5, 0], [5, 5, 10]]
  abs: 1.0e-06

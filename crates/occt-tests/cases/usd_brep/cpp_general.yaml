case: planar_face_with_two_holes
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmTrimmedSurfaces.cpp
  test: TestSmCreatePlanarFaces
notes:
- 'With TestSmTrimSurfaceWith3dCurves: an L, less a triangle and a disc.'
build:
- lw:
    polyline:
      points: [[0, 0, 0], [10, 0, 0], [10, 5, 0], [5, 5, 0], [5, 10, 0], [0, 10, 0], [0, 0, 0]]
- l:
    face:
      wire: lw
- tw:
    polyline:
      points: [[1, 5, 0], [1, 8, 0], [4, 5, 0], [1, 5, 0]]
- t:
    face:
      wire: tw
- cc:
    circle:
      center: [6, 2.5, 0]
      normal: [0, 0, 1]
      radius: 1.5
- ce:
    edge:
      curve: cc
- cw:
    wire:
      edges: [ce]
- c:
    face:
      wire: cw
- m:
    difference:
      object: l
      tool: t
- result:
    difference:
      object: m
      tool: c
checks:
- count: result
  eq:
    faces: 1
- area: result
  eq: 75 - 4.5 - 2.25*pi
  rel: 1.0e-06

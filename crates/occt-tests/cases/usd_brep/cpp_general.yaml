case: regular_hexagon
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmCurves.cpp
  test: TestSmCreateRegularPolygon
notes:
- usd-brep checks the number of sides.
build:
- resultw:
    polyline:
      points: [[5.0, 0.0, 0], [2.5000000000000004, 4.330127018922193, 0], [-2.499999999999999, 4.330127018922194,
          0], [-5.0, 6.123233995736766e-16, 0], [-2.500000000000002, -4.330127018922192, 0], [2.5000000000000004,

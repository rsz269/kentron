# Translated from usd-brep's tests into kentron's case format, with the checks strengthened:
# changed from the originals as each case's notes say. See crates/occt-tests/README.md.
case: rotate_box_about_y_through_the_origin
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmGeneral.cpp
  test: TestSmTransform
notes:
- usd-brep checks the call.
build:
- s:
    box:
      size: [5, 10, 15]
      corner: [0, 0, 0]
- result:
    rotate:
      shape: s
      axis:
        origin: [0, 0, 0]
        direction: [0, 1, 0]
      angle: 45
checks:
- valid: result
- volume: result
  eq: 750
  rel: 1.0e-06
- bounds: result
  eq: [[0, 0, -5*sqrt(0.5)], [20*sqrt(0.5), 10, 15*sqrt(0.5)]]
  abs: 1.0e-06
---
case: rotate_cube_about_z
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmGeneral.cpp
  test: TestSmRotate
notes:
- usd-brep checks the call.
build:
- s:
    box:
      size: [5, 5, 5]
      corner: [0, 0, 0]
- result:
    rotate:
      shape: s
      axis:
        origin: [0, 0, 0]
        direction: [0, 0, 1]
      angle: 45
checks:
- valid: result
- bounds: result
  eq: [[-5*sqrt(0.5), 0, 0], [5*sqrt(0.5), 10*sqrt(0.5), 5]]
  abs: 1.0e-06
---
case: translate_cube
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmGeneral.cpp
  test: TestSmTranslate
notes:
- usd-brep checks the call.
build:
- s:
    box:
      size: [5, 5, 5]
      corner: [0, 0, 0]
- result:
    translate:
      shape: s
      by: [1, 2, 4]
checks:
- valid: result
- bounds: result
  eq: [[1, 2, 4], [6, 7, 9]]
  abs: 1.0e-06
---
case: arc_of_135_degrees
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmCurves.cpp
  test: TestSmCreateArc
notes:
- usd-brep checks the call.
build:
- c:
    circle:
      center: [0, 0, 0]
      normal: [0, 0, 1]
      radius: 10
- result:
    edge:
      curve: c
      range: [0, 3*pi/4]
checks:
- length: result
  eq: 10*3*pi/4
  rel: 1.0e-06
---
case: rectangle_10_by_6
ported_from:

# Translated from usd-brep's tests into kentron's case format, with the checks strengthened:
# changed from the originals as each case's notes say. See crates/occt-tests/README.md.
case: box_less_a_sphere_on_its_base
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmBrep.cpp
  test: TestSmBoolean
notes:
- 'The expected volume by a midpoint rule over the box''s base (15 less the sphere''s height there), at 3.2e7 points:
  usd-brep only checks the call.'
build:
- a:
    box:
      size: [5, 10, 15]
      corner: [0, 0, 0]
- b:
    sphere:
      radius: 10
      frame:
        origin: [3, 5, 0]
- result:
    difference:
      object: a
      tool: b
checks:
- valid: result
- count: result
  eq:
    solids: 1
- volume: result
  eq: 277.8850841612334
  rel: 1.0e-05
---
case: box_less_its_inscribed_sphere
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmBrep.cpp
  test: TestSmBooleanWithOptions
notes:
- 'A sphere touching each of the box''s faces at a point. usd-brep checks the call: the measures added.'
build:
- a:
    box:
      size: [10, 10, 10]
      corner: [0, 0, 0]
- b:
    sphere:
      radius: 5
      frame:
        origin: [5, 5, 5]
- result:
    difference:
      object: a
      tool: b
checks:
- valid: result
- volume: result
  eq: 1000 - 4/3*pi*125
  rel: 1.0e-06
- area: result
  eq: 600 + 100*pi
  rel: 1.0e-06
---

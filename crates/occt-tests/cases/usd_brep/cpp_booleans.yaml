case: prism_crossing_a_cylinder_twice
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmBrep.cpp
  test: TestSmDeleteFaceKeepsInfiniteRegion
notes:
- 'The geometry of usd-brep''s test of a region list, an internal matter: the prism less the cylinder it crosses
  twice, in closed form.'
build:
- p:
    box:
      size: [20, 12, 100]
      corner: [-10, -6, 0]
- c0:
    cylinder:
      radius: 30
      height: 88
      frame:
        origin: [0, -44, 60]
        z: y
- result:
    difference:
      object: p
      tool: c0
checks:
- valid: result
- count: result
  eq:
    solids: 2
- volume: result
  eq: 12*(2000 - 2*(10*sqrt(800) + 900*asin(1/3)))
  rel: 1.0e-06
---
case: shell_outward_closed
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmBrep.cpp
  test: TestSmShellBrepFull
brute:
  result:
    test: (x>=-1)&(x<=11)&(y>=-1)&(y<=11)&(z>=-1)&(z<=11)&~s(x,y,z)
    box:
    - - -1
      - -1
      - -1
    - - 11
      - 11
      - 11
build:
- s:
    box:
      size: [10, 10, 10]
      corner: [0, 0, 0]
- result:
    thick_solid:
      shape: s
      faces: []
      thickness: 1
      join: intersection
checks:
- valid: result
- count: result
  eq:
    solids: 1
- volume: result
  eq: 728
  rel: 1.0e-06
- bounds: result
  eq: [[-1, -1, -1], [11, 11, 11]]
  abs: 1.0e-06
---

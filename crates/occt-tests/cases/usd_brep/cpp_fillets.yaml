case: remove_fillets_of_a_nurbs_box
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmFillets.cpp
  test: TestSmRemoveFilletNurbsPlanes
notes:
- 'A known gap: kentron leaves no faces where SMLib, OCCT and sampling give the box. All the fillets are one feature, connected at the corners, and defeature.rs carries the faces around a feature over it as cells.'
- 'usd-brep also makes the flat faces'' control points uneven, reaching into its B-spline surfaces: left out.'
expect: not_done
brute:
  result:
    test: s(x,y,z)
    box:
    - - 0
      - 0
      - 0
    - - 10
      - 10
      - 10
build:
- s:
    box:
      size: [10, 10, 10]
      corner: [0, 0, 0]
- e0:
    select:
      of: s
      edge: [0, 0, 5.0]
- e1:
    select:
      of: s
      edge: [0, 10, 5.0]
- e2:
    select:
      of: s
      edge: [10, 0, 5.0]
- e3:
    select:
      of: s
      edge: [10, 10, 5.0]
- e4:
    select:
      of: s
      edge: [5.0, 0, 0]
- e5:
    select:
      of: s
      edge: [5.0, 0, 10]
- e6:
    select:
      of: s
      edge: [5.0, 10, 0]
- e7:
    select:
      of: s
      edge: [5.0, 10, 10]
- e8:
    select:
      of: s
      edge: [0, 5.0, 0]
- e9:
    select:
      of: s
      edge: [0, 5.0, 10]
- e10:
    select:
      of: s
      edge: [10, 5.0, 0]
- e11:
    select:
      of: s
      edge: [10, 5.0, 10]
- r:
    fillet:
      shape: s
      edges: [e0, e1, e2, e3, e4, e5, e6, e7, e8, e9, e10, e11]
      radius: 1
- n:
    to_nurbs:
      shape: r
- f0:
    select:
      of: n
      face: [1 - 2/pi, 1 - 2/pi, 5]
- f1:
    select:
      of: n
      face: [1 - 2/pi, 9 + 2/pi, 5]
- f2:
    select:
      of: n
      face: [9 + 2/pi, 1 - 2/pi, 5]
- f3:
    select:
      of: n
      face: [9 + 2/pi, 9 + 2/pi, 5]
- f4:
    select:
      of: n
      face: [1 - 2/pi, 5, 1 - 2/pi]
- f5:
    select:
      of: n
      face: [1 - 2/pi, 5, 9 + 2/pi]
- f6:
    select:
      of: n
      face: [9 + 2/pi, 5, 1 - 2/pi]
- f7:
    select:
      of: n
      face: [9 + 2/pi, 5, 9 + 2/pi]
- f8:
    select:
      of: n
      face: [5, 1 - 2/pi, 1 - 2/pi]
- f9:
    select:
      of: n
      face: [5, 1 - 2/pi, 9 + 2/pi]
- f10:
    select:
      of: n
      face: [5, 9 + 2/pi, 1 - 2/pi]
- f11:
    select:
      of: n
      face: [5, 9 + 2/pi, 9 + 2/pi]
- f12:
    select:
      of: n
      face: [0.5, 0.5, 0.5]
- f13:
    select:
      of: n
      face: [0.5, 0.5, 9.5]
- f14:
    select:
      of: n
      face: [0.5, 9.5, 0.5]
- f15:
    select:
      of: n
      face: [0.5, 9.5, 9.5]
- f16:
    select:
      of: n
      face: [9.5, 0.5, 0.5]
- f17:
    select:
      of: n
      face: [9.5, 0.5, 9.5]
- f18:
    select:
      of: n
      face: [9.5, 9.5, 0.5]
- f19:
    select:
      of: n
      face: [9.5, 9.5, 9.5]
- result:
    remove_faces:
      shape: n
      faces: [f0, f1, f2, f3, f4, f5, f6, f7, f8, f9, f10, f11, f12, f13, f14, f15, f16, f17, f18, f19]
checks:
- valid: result
- count: result
  eq:
    faces: 6
- volume: result
  eq: 1000
  rel: 1.0e-06

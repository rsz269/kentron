# Translated from usd-brep's tests into kentron's case format, with the checks strengthened:
# changed from the originals as each case's notes say. See crates/occt-tests/README.md.
case: round_box_5_10_15
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmFillets.cpp
  test: TestSmCircularFillet
notes:
- 'Every edge of the box rounded: Steiner''s formula for the volume and area.'
params:
  hx: 2.5
  hy: 5
  hz: 7.5
  r: 0.5
brute:
  rounded: (np.maximum(abs(x-hx)-(hx-r),0)**2 + np.maximum(abs(y-hy)-(hy-r),0)**2 + np.maximum(abs(z-hz)-(hz-r),0)**2
    <= r*r)
  result: (np.maximum(abs(x-hx)-(hx-r),0)**2 + np.maximum(abs(y-hy)-(hy-r),0)**2 + np.maximum(abs(z-hz)-(hz-r),0)**2
    <= r*r)
build:
- s:
    box:
      size: [5, 10, 15]
      corner: [0, 0, 0]
- e0:
    select:
      of: s
      edge: [0, 0, 7.5]
- e1:
    select:
      of: s
      edge: [0, 10, 7.5]
- e2:
    select:
      of: s
      edge: [5, 0, 7.5]
- e3:
    select:
      of: s
      edge: [5, 10, 7.5]
- e4:
    select:
      of: s
      edge: [2.5, 0, 0]
- e5:
    select:
      of: s
      edge: [2.5, 0, 15]
- e6:
    select:
      of: s
      edge: [2.5, 10, 0]
- e7:
    select:
      of: s
      edge: [2.5, 10, 15]
- e8:
    select:
      of: s
      edge: [0, 5.0, 0]
- e9:
    select:
      of: s
      edge: [0, 5.0, 15]
- e10:
    select:
      of: s
      edge: [5, 5.0, 0]
- e11:
    select:
      of: s
      edge: [5, 5.0, 15]
- rounded:
    fillet:
      shape: s
      edges: [e0, e1, e2, e3, e4, e5, e6, e7, e8, e9, e10, e11]
      radius: 0.5
- result: rounded
checks:
- valid: result
- count: result
  eq:
    faces: 26
- volume: result
  eq: 4.0*9.0*14.0 + 2*0.5*(4.0*9.0 + 9.0*14.0 + 14.0*4.0) + pi*0.5^2*(4.0 + 9.0 + 14.0) + 4/3*pi*0.5^3
  rel: 1.0e-06
- area: result
  eq: 2*(4.0*9.0 + 9.0*14.0 + 14.0*4.0) + 2*pi*0.5*(4.0 + 9.0 + 14.0) + 4*pi*0.5^2
  rel: 1.0e-06
- bounds: result
  eq: [[0, 0, 0], [5, 10, 15]]
  abs: 1.0e-06
---
case: chamfer_box_5_10_15
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmFillets.cpp
  test: TestSmChamferFillet
notes:
- usd-brep's chamfer of width 0.5 is one of distance sqrt(2)/4 along each face.
params:
  d: sqrt(2)/4
brute:
  result: s(x,y,z)&(abs(x-2.5)+abs(y-5)<=7.5-d)&(abs(y-5)+abs(z-7.5)<=12.5-d)&(abs(x-2.5)+abs(z-7.5)<=10-d)
build:
- s:
    box:
      size: [5, 10, 15]
      corner: [0, 0, 0]
- e0:
    select:
      of: s
      edge: [0, 0, 7.5]
- e1:
    select:
      of: s
      edge: [0, 10, 7.5]
- e2:
    select:
      of: s
      edge: [5, 0, 7.5]
- e3:
    select:
      of: s
      edge: [5, 10, 7.5]
- e4:
    select:
      of: s
      edge: [2.5, 0, 0]
- e5:
    select:
      of: s
      edge: [2.5, 0, 15]
- e6:
    select:
      of: s
      edge: [2.5, 10, 0]
- e7:
    select:
      of: s
      edge: [2.5, 10, 15]
- e8:
    select:
      of: s
      edge: [0, 5.0, 0]
- e9:
    select:
      of: s
      edge: [0, 5.0, 15]
- e10:
    select:
      of: s
      edge: [5, 5.0, 0]
- e11:
    select:
      of: s
      edge: [5, 5.0, 15]
- result:
    chamfer:
      shape: s
      edges: [e0, e1, e2, e3, e4, e5, e6, e7, e8, e9, e10, e11]
      distance: sqrt(2)/4
checks:
- valid: result
- count: result
  eq:
    solids: 1
- bounds: result
  eq: [[0, 0, 0], [5, 10, 15]]
  abs: 1.0e-06

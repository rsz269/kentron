case: round_four_edges_four_radii
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmFillets.cpp
  test: TestSmFilletEdgesPerEdge
notes:
- 'usd-brep''s first four edges by position, with radii 0.5 to 1.25: three of them meet at corners, whose blend
  is a kernel''s choice, so the volume is bounded by the fillets'' straight runs.'
build:
- s:
    box:
      size: [10, 10, 10]
      corner: [0, 0, 0]
- e0:
    select:
      of: s
      edge: [10, 5, 10]
- e1:
    select:
      of: s
      edge: [5, 10, 10]
- e2:
    select:
      of: s
      edge: [0, 5, 0]
- e3:
    select:
      of: s
      edge: [0, 5, 10]
- result:
    fillet:
      shape: s
      edges: [{edge: e0, radius: 0.5}, {edge: e1, radius: 0.75}, {edge: e2, radius: 1.0}, {edge: e3, radius: 1.25}]
checks:
- valid: result
- count: result
  eq:
    solids: 1
- volume: result
  lt: 1000
- volume: result
  gt: 1000 - (1 - pi/4)*10*(0.25 + 0.5625 + 1 + 1.5625)
- bounds: result
  eq: [[0, 0, 0], [10, 10, 10]]
  abs: 1.0e-06
---
case: round_edge_radius_law_along_x
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmFillets.cpp
  test: TestSmVariableRadiusFillet
notes:
- 'One of usd-brep''s four edges, alone: the four meet at corners with radii that differ.'
build:
- s:
    box:
      size: [10, 10, 10]
      corner: [0, 0, 0]
- e:
    select:
      of: s
      edge: [0, 5, 0]
- result:
    fillet:
      shape: s
      edges: [{edge: e, law: [[0, 0.5], [1, 2]]}]
checks:
- valid: result
- count: result
  eq:
    faces: 7

case: planar_circle_radius_10
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmPrimitives.cpp
  test: TestSmCreatePlanarCircle
notes:
- 'usd-brep only checks that the call succeeds: the measures added, in closed form.'
build:
- resultc:
    circle:
      center: [0, 0, 0]
      normal: [0, 0, 1]
      radius: 10
- resulte:
    edge:
      curve: resultc
- resultw:
    wire:
      edges: [resulte]
- result:
    face:
      wire: resultw
checks:
- count: result
  eq:
    faces: 1
- area: result
  eq: 100*pi
  rel: 1.0e-06
---
case: box_far_from_the_origin
ported_from:
  project: usd-brep

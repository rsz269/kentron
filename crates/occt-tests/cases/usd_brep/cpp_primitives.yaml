case: inertia_rotated_box
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmBrep.cpp
  test: TestSmMassProperties
notes:
- usd-brep's closed forms at density 2 (2560, 2240, 800), halved for density 1.
build:
- s:
    box:
      size: [2, 6, 10]
      corner: [0, 0, 0]
- result:
    rotate:
      shape: s
      axis:
        origin: [1, 3, 5]
        direction: [0, 0, 1]
      angle: 30
checks:
- volume: result
  eq: 120
  rel: 1.0e-06
- area: result
  eq: 184
  rel: 1.0e-06
- centroid: result
  eq: [1, 3, 5]
  abs: 1.0e-07
- inertia: result
  eq: [1280, 1120, 400]
  rel: 1.0e-07

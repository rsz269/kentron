notes:
- 'usd-brep checks its faces'' areas at these coordinates: the volume, centroid and bounds added.'
build:
- result:
    box:
      size: [2, 3, 4]
      corner: [100000.0, -200000.0, 300000.0]
checks:
- valid: result
- area: result
  eq: 52
  rel: 1.0e-06
- volume: result
  eq: 24
  rel: 1.0e-06
- centroid: result
  eq: [100001, -199998.5, 300002]
  abs: 1.0e-06
- bounds: result
  eq: [[100000.0, -200000.0, 300000.0], [100002, -199997, 300004]]
  abs: 1.0e-06
---
case: inertia_sphere_near_from_the_origin
ported_from:
  project: usd-brep
  repo: https://github.com/NVIDIA-Omniverse/usd-brep
  git_hash: 3fd5b9548d19aa8c12c29bc9637a96d42a06f8a5
  file: tests/SM_API_test/src/TestSmBrep.cpp
  test: TestSmMassPropertiesFarOrigin
notes:
- 'usd-brep takes moments about a distant origin with the sphere at its centre: here the sphere is moved the other
  way, and its moments about its own centroid are checked at density 1.'
build:
- s:
    sphere:
      radius: 2
      frame:
        origin: [0, 0, 0]
- result:
    translate:
      shape: s
      by: [-5, 10, -15]
checks:
- volume: result
  eq: 4/3*pi*8
  rel: 1.0e-06
- centroid: result
  eq: [-5, 10, -15]
  abs: 1.0e-06
- inertia: result
  eq: [0.4*(4/3*pi*8)*4, 0.4*(4/3*pi*8)*4, 0.4*(4/3*pi*8)*4]
  rel: 1.0e-06
---

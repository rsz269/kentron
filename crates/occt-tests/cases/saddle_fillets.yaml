case: saddle_occt_blend_simple_x5
tags: [blend, saddle]
notes: >-
  OCCT's tests/blend/simple/X5 (and tolblend_simple/B3, the same model), whose six edges
  meet at a saddle: OCCT's check is the area within 1%, which a corner without its patch
  passes. Here OCCT 7.9's own area and volume, closely.
build:
  - s: {load: {brep: "CCV_1_i12gsl.rle"}}
  - s: {rotate: {shape: s, axis: {origin: [0, 0, 0], direction: [0, 0, 1]}, angle: -85}}
  - s_15: {select: {of: s, edge: [108.335044084, -90.9038955344, 150.0], length: 100.0}}
  - s_16: {select: {of: s, edge: [103.977256947, -41.0941606298, 100.0], length: 100.0}}
  - s_18: {select: {of: s, edge: [58.5253091794, -95.2616826718, 100.0], length: 100.0}}
  - s_20: {select: {of: s, edge: [108.335044084, -90.9038955344, 50.0], length: 100.0}}
  - s_22: {select: {of: s, edge: [112.692831221, -140.713630439, 100.0], length: 100.0}}
  - s_25: {select: {of: s, edge: [158.144778989, -86.546108397, 100.0], length: 100.0}}
  - result: {fillet: {shape: s, edges: [{edge: s_22, radius: 10}, {edge: s_20, radius: 10}, {edge: s_25, radius: 10}, {edge: s_16, radius: 10}, {edge: s_15, radius: 10}, {edge: s_18, radius: 10}]}}
checks:
  - valid: result
  - volume: result
    eq: 4000000.0
    rel: 1e-6
  - area: result
    eq: 177551.414
    rel: 1e-4

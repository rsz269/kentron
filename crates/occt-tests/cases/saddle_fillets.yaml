# Fillets at saddle vertices: three concave and three convex edges meeting at one corner,
# as where three box arms join. Volumes and areas are OCCT's (7.9, through
# CadQuery 2.8's OCP), whose corner patches lie between the closing-then-opening and the
# opening-then-closing of the solid by the balls (`tools/brute.py between`). With one radius,
# a saddle's corner is symmetric (material and void change places in the vertex), so any
# symmetric corner has OCCT's volume: the area tells them apart. The unions leave each concave
# edge in two pieces (split where an arm's edge began), both selected.

case: saddle_arms_all_edges
tags: [blend, saddle]
notes: >-
  Three 6 x 6 arms along +x, +y and +z, unioned, every edge rounded (R 1):
  the saddle at (3, 3, 3) and the mixed corners about it.
build:
  - a0: { box: { corner: [0, -3, -3], size: [15, 6, 6] } }
  - a1: { box: { corner: [-3, 0, -3], size: [6, 15, 6] } }
  - a2: { box: { corner: [-3, -3, 0], size: [6, 6, 15] } }
  - s: { union: { object: a0, tool: a1 } }
  - s: { union: { object: s, tool: a2 } }
  - result: { fillet: { shape: s, edges: all, radius: 1 } }
checks:
  - valid: result
  - count: result
    eq: { solids: 1 }
  - volume: result
    eq: 1441.09054
    rel: 1e-5
  - area: result
    eq: 966.176036
    rel: 2e-4
---

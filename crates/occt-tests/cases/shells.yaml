# Shells (thick solids) whose walls are thicker than the solid's fillets or chamfers, so that
# faces vanish from the inside (the inner fillets' radius goes past zero, a chamfered corner's
# triangle is passed by its neighbours' offsets), and openings at faces the walls meet
# tangentially. Volumes in closed form: a box rounded by r is its core (side L) grown by a
# ball, L³ + 6L²r + 3πLr² + 4πr³/3; a chamfered box's cavity is the polytope of its faces'
# planes moved in (scipy's half-space intersection gives the chamfered ones' volumes).
# CadQuery (OCCT) gives the filleted box's open shells back unchanged, or invalid.
case: filleted_box_open_shell_thinner_than_the_fillets
build:
  - b: { box: { size: [20, 20, 20], corner: [-10, -10, -10] } }
  - f: { fillet: { shape: b, edges: all, radius: 2 } }
  - top: { select: { of: f, face: [0, 0, 10] } }
  - result: { thick_solid: { shape: f, faces: [top], thickness: -1 } }
checks:
  - valid: result
  # (The cavity: the core grown by 1, and over the top face the 16 by 16 opening, 1 deep:
  # the walls end square to the fillets' edges there.)
  - volume: result
    eq: "(16^3 + 6*16^2*2 + 3*pi*16*4 + 4*pi*8/3) - (16^3 + 6*16^2*1 + 3*pi*16*1 + 4*pi/3) - 16*16*1"
    rel: 1.0e-6
---
case: filleted_box_open_shell_outwards
build:
  - b: { box: { size: [20, 20, 20], corner: [-10, -10, -10] } }
  - f: { fillet: { shape: b, edges: all, radius: 2 } }
  - top: { select: { of: f, face: [0, 0, 10] } }
  - result: { thick_solid: { shape: f, faces: [top], thickness: 3 } }
checks:
  - valid: result
  # (Out to the core grown by 5, less the solid and the opening over the top face, 3 high.)
  - volume: result
    eq: "(16^3 + 6*16^2*5 + 3*pi*16*25 + 4*pi*125/3) - (16^3 + 6*16^2*2 + 3*pi*16*4 + 4*pi*8/3) - 16*16*3"
    rel: 1.0e-6
---
case: filleted_box_open_shell_outwards_by_intersection
# (No edge is sharp: joined by intersection as by arcs.)
build:
  - b: { box: { size: [20, 20, 20], corner: [-10, -10, -10] } }
  - f: { fillet: { shape: b, edges: all, radius: 2 } }
  - top: { select: { of: f, face: [0, 0, 10] } }
  - result: { thick_solid: { shape: f, faces: [top], thickness: 3, join: intersection } }
checks:
  - valid: result
  - volume: result
    eq: "(16^3 + 6*16^2*5 + 3*pi*16*25 + 4*pi*125/3) - (16^3 + 6*16^2*2 + 3*pi*16*4 + 4*pi*8/3) - 16*16*3"
    rel: 1.0e-6
---
case: filleted_box_closed_shell_thicker_than_the_fillets
build:
  - b: { box: { size: [20, 20, 20], corner: [-10, -10, -10] } }
  - f: { fillet: { shape: b, edges: all, radius: 3 } }
  - result: { thick_solid: { shape: f, faces: [], thickness: -4 } }
checks:
  - valid: result
  # (The cavity: the core, 14 on a side, shrunk by 1, its edges sharp.)
  - volume: result
    eq: "(14^3 + 6*14^2*3 + 3*pi*14*9 + 4*pi*27/3) - 12^3"
    rel: 1.0e-6
---
case: cylinder_open_shell_thicker_than_its_fillet
build:
  - c: { cylinder: { radius: 10, height: 20 } }
  - rim: { select: { of: c, edge: [0, 0, 20] } }
  - f: { fillet: { shape: c, edges: [rim], radius: 3 } }
  - bottom: { select: { of: f, face: [0, 0, 0] } }
  - result: { thick_solid: { shape: f, faces: [bottom], thickness: -4 } }
checks:
  - valid: result
  # (The fillet takes away its corner's area 9(1 - π/4), whose centroid is 3(10 - 3π)/(12 - 3π)
  # in from the corner, turned round the axis; the cavity, 6 round and 16 high, is sharp.)
  - volume: result
    eq: "pi*100*20 - 2*pi*(10 - 3*(10 - 3*pi)/(12 - 3*pi))*9*(1 - pi/4) - pi*36*16"
    rel: 1.0e-6
---
case: chamfered_box_closed_shell_past_its_corners
# (Each corner's triangle, moved in by 3, is passed by its neighbours' offsets: it vanishes.)
build:
  - b: { box: { size: [20, 20, 20], corner: [-10, -10, -10] } }
  - c: { chamfer: { shape: b, edges: all, distance: 2 } }
  - result: { thick_solid: { shape: c, faces: [], thickness: -3 } }
checks:
  - valid: result
  # (Each edge takes away a prism of 2 by 16; each corner's 2-cube keeps 4/3 of its 8.)
  - volume: c
    eq: "8000 - 12*2*16 - 8*(8 - 4/3)"
    rel: 1.0e-9
  - volume: result
    eq: 4823.526412823269
    rel: 1.0e-6
---
case: chamfered_box_open_shell_past_its_corners
build:
  - b: { box: { size: [20, 20, 20], corner: [-10, -10, -10] } }
  - c: { chamfer: { shape: b, edges: all, distance: 2 } }
  - top: { select: { of: c, face: [0, 0, 10] } }
  - result: { thick_solid: { shape: c, faces: [top], thickness: -3 } }
checks:
  - valid: result
  - volume: result
    eq: 4482.848489486468
    rel: 1.0e-6

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 298" width="860" height="298" role="img" aria-label="A solid with two voids made from one small box placed twice: OCCT's solid holds the placed faces themselves, kentron's holds copies of them, which the operation's history does not list.">

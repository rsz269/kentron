}.cut{fill:#4b4a45;fill-opacity:.9}.node{fill:#1a1a19;stroke:#c3c2b7}.group{fill:#2e2e2b;stroke:#c3c2b7}.off{stroke:#ff6b6b}.ghost{stroke:#77766f}.dot{fill:#c3c2b7}.bad{fill:#e04a4a}.good{fill:#22a722}.glyph{stroke:#1a1a19}}</style>

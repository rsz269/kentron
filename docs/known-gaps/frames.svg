<text x="20" y="31" class="title">An off-centre profile carried along a spline spine by two frames</text>
<text x="20" y="49" class="note small">a sketch: the angle between the frames drawn some thousand times larger than the 2e-4 to 9e-4 rad measured</text>
<g transform="translate(27 283.5)"><circle class="bad" r="7"/><path class="glyph" d="M-2.7 -2.7L2.7 2.7M2.7 -2.7L-2.7 2.7"/></g>
<text x="40" y="288" class="small">the profile's centre moves round the spine: the pipe's volume and area change with the curvature times the offset times the angle</text>
<path class="leader" d="M465 84L430 178"/><circle class="dot" cx="430" cy="178" r="2.2"/>
<text x="470" y="88" class="note small halo">the spine</text>
<text x="34" y="82" class="note small">blue: the profile placed by the rotation-minimizing frame</text>
<text x="34" y="98" class="note small">orange: placed by kentron's discrete frame (ten samples a span)</text>
</svg>

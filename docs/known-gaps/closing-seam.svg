<text x="40" y="328" class="small">the rim runs once round: the face's side is told</text>
<text x="82" y="92" class="note small" text-anchor="end">v = 1</text>
<text x="82" y="272" class="note small" text-anchor="end">v = 0</text>
<text x="235.5" y="288" class="note small" text-anchor="middle">u</text>
